\* TLC configuration for formal/commitment.tla at Capacity = 3.
\*
\* The three configurations the module's own trailer names, extracted into files so the
\* check is a command rather than a transcription exercise. Sec 24.2 is explicit that
\* capacity 1 alone is insufficient: "A fencing model checked only at capacity = 1 cannot
\* exhibit the defect that fencing at capacity > 1 exists to prevent, so the configuration
\* under check is itself part of the requirement."
\*
\* Liveness is deliberately NOT asserted here. The module's trailer states why: the two
\* Sec 24.2 liveness properties are properties of the lifecycle machine and its durable
\* timers, and asserting them over a model with no timers would check the model rather than
\* the design. They are asserted in lifecycle_c3.cfg, where the timers exist.
\*
\* Run:  java -jar tla2tools.jar -config commitment_c3.cfg -workers auto commitment.tla

SPECIFICATION Spec

CONSTANTS
    Legs = {l1,l2,l3,l4}
    Workers = {w1,w2}
    Capacity = 3
    MaxFence = 6

INVARIANT Safety
