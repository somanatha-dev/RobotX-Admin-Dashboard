\* TLC configuration for formal/lifecycle.tla at Capacity = 2.
\*
\* Sec 24.2 requires the check at capacity 1, 2 AND 3: "A fencing model checked only
\* at capacity = 1 cannot exhibit the defect that fencing at capacity > 1 exists to
\* prevent, so the configuration under check is itself part of the requirement." The
\* same argument applies to the lifecycle -- a reassignment that leaves a sibling
\* commitment unsupervised is only expressible with a sibling.
\*
\* Legs is sized to Capacity + 1 so that at least one Leg is always contending for a
\* slot that is full: a model whose Leg count never exceeds Capacity never exercises
\* the bound it is checking.
\*
\* Run:  java -jar tla2tools.jar -config lifecycle_c2.cfg -workers auto lifecycle.tla

SPECIFICATION Spec

CONSTANTS
    Legs = {l1,l2,l3}
    Capacity = 2
    MaxTicks = 3

INVARIANT Safety

PROPERTY
    TerminalIsFinal
    Liveness
